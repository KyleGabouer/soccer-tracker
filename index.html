<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Soccer Stats Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f2ee;
      --surface2: #eceae3;
      --border: rgba(10,10,10,0.12);
      --text: #0a0a0a;
      --muted: #6b6b6b;
      --accent: #eef03a;
      --accent-dim: rgba(238,240,58,0.35);
      --accent-ink: #0a0a0a;
      --red: #c33125;
      --red-dim: rgba(195,49,37,0.08);
      --radius: 12px;
      --radius-sm: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Tab bar ── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .tab.active { color: var(--text); }
    .tab svg { width: 22px; height: 22px; }

    /* ── Views ── */
    .view { display: none; padding: 1rem 1rem 6rem; }
    .view.active { display: block; }

    /* ── Header ── */
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-top: 0.5rem;
    }

    .view-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.55rem 1rem;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .btn:active { opacity: 0.7; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.78rem; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger { background: var(--bg); color: var(--red); border: 1px solid var(--red); }
    .btn-blue { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-accent { background: var(--accent); color: var(--accent-ink); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    /* ── Forms ── */
    .input, select.input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus { border-color: transparent; outline: 2px solid var(--accent); outline-offset: 1px; }
    .input::placeholder { color: var(--muted); }

    .form-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .form-row .input { flex: 1; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
      max-height: 85dvh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .modal-actions .btn { flex: 1; justify-content: center; }

    /* ── Roster Grid ── */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .roster-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.85rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .roster-card:active { transform: scale(0.96); }

    .roster-photo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0.4rem;
      background: var(--surface2);
      border: 2px solid var(--border);
    }

    .roster-initials {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .roster-card .rc-number {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .roster-card .rc-name {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .roster-card .rc-stats {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Profile modal ── */
    .profile-photo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .profile-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface2);
      border: 3px solid var(--border);
    }

    .profile-initials {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--surface2);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--muted);
    }

    .profile-photo-label {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .profile-stats-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .profile-stat {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0;
      background: var(--surface2);
      border-radius: 8px;
    }

    .profile-stat .ps-val {
      font-size: 1.3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .profile-stat .ps-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-game-log {
      margin-top: 0.25rem;
    }

    .profile-game-entry {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .profile-game-entry:last-child { border-bottom: none; }

    .pge-opp { font-weight: 600; margin: 0.1rem 0; }
    .pge-date { color: var(--muted); font-size: 0.75rem; }
    .pge-stats { font-weight: 700; color: var(--text); font-size: 0.8rem; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }

    /* ── Old roster items (unused now but kept for delete btn style) ── */
    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      font-size: 1.1rem;
      line-height: 1;
    }

    .delete-btn:hover { color: var(--red); }

    /* ── Live Game ── */
    .game-status {
      text-align: center;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }

    .game-opponent {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .game-score {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin: 0.25rem 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .game-clock {
      font-size: 0.85rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .prompt-text {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-ink);
      background: var(--accent);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .player-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0.85rem 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .player-btn:active { transform: scale(0.95); }
    .player-btn .p-number { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .player-btn .p-name { font-size: 0.65rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

    .player-btn.selecting-goal {
      border-color: var(--text);
      background: var(--accent-dim);
    }

    .player-btn.selecting-assist {
      border-color: var(--text);
      background: var(--surface2);
    }

    .goal-log {
      margin-top: 0.5rem;
    }

    .goal-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .goal-entry:last-child { border-bottom: none; }

    .goal-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      margin-right: 0.6rem;
      flex-shrink: 0;
    }

    .goal-info { flex: 1; }
    .goal-scorer { font-weight: 600; }
    .goal-assist { color: var(--muted); font-size: 0.78rem; }

    .goal-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 6px;
    }

    /* ── No game state ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.3; }
    .empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }
    .empty-state p { font-size: 0.88rem; margin-bottom: 1.5rem; }

    /* ── Season stats ── */
    .stats-table {
      width: 100%;
      border-collapse: collapse;
    }

    .stats-table th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .stats-table th:nth-child(n+3) { text-align: center; }
    .stats-table th.sorted { color: var(--text); }

    .stats-table td {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .stats-table td:nth-child(2n) {
      font-variant-numeric: tabular-nums;
    }

    .stats-table td:nth-child(n+3) {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .stats-table tr:last-child td { border-bottom: none; }

    /* ── Game history ── */
    .game-card {
      cursor: pointer;
    }

    .game-card-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }

    .game-card-opponent { font-weight: 700; font-size: 1rem; }

    .game-card-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .game-card-score {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .game-card-stats {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
    }

    .game-detail-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 1rem;
      font-family: inherit;
    }

    /* ── Skip assist ── */
    .skip-assist {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    /* ── Category badge ── */
    .category-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Filter pills ── */
    .filter-row {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.75rem;
      margin-bottom: 0.25rem;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar { display: none; }

    .filter-pill {
      flex-shrink: 0;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: var(--accent-dim);
      border-color: var(--text);
      color: var(--text);
    }

    /* ── Settings items ── */
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .settings-item:last-child { border-bottom: none; }

    .settings-item-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      cursor: pointer;
    }

    .settings-item-emoji {
      font-size: 1.2rem;
      width: 28px;
      text-align: center;
    }

    .settings-item-name {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .settings-item-actions {
      display: flex;
      gap: 0.3rem;
    }

    .form-group {
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

<!-- ── Tab Bar ── -->
<div class="tab-bar">
  <button class="tab active" data-view="game" onclick="goToView('game')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Game
  </button>
  <button class="tab" data-view="history" onclick="goToView('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Schedule
  </button>
  <button class="tab" data-view="stats" onclick="goToView('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Stats
  </button>
  <button class="tab" data-view="roster" onclick="goToView('roster')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Team
  </button>

    <svg id="tab-settings-icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <svg id="tab-settings-icon-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span id="tab-settings-label">Login</span>
  </button>
</div>

<!-- ── Game View ── -->
<div class="view active" id="view-game"></div>

<!-- ── History View ── -->
<div class="view" id="view-history"></div>

<!-- ── Stats View ── -->
<div class="view" id="view-stats"></div>

<!-- ── Roster View ── -->
<div class="view" id="view-roster"></div>

<!-- ── Settings View ── -->
<div class="view" id="view-settings"></div>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── Supabase client ──
const SUPABASE_URL = 'https://thzekzodeuizscohwirj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5Oi0WQ_pKrGbCVVo0zXfTw_BMvz-4oF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Auth (only a signed-in user — you — can edit) ──
let currentSession = null;

function isAdmin() { return !!currentSession; }

sb.auth.getSession().then(({ data }) => {
  currentSession = data.session;
  render();
});

sb.auth.onAuthStateChange((_event, session) => {
  currentSession = session;
  render();
});

async function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('admin-login-error');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    return;

// ── Data layer ──
const STORAGE_KEY = 'soccer-stats';

function loadDataLocal() {
  const raw = localStorage.getItem(STORAGE_KEY);
  let d;
  if (raw) {
    d = JSON.parse(raw);
  } else {
    d = { players: [], games: [], competitions: [], teams: [], activeGameId: null };
  }
  if (!d.competitions) d.competitions = [];
  if (!d.teams) d.teams = [];
  if (!d.ownTeam) d.ownTeam = { name: '', logo: null };
  if (d.ownTeam.name === undefined) d.ownTeam.name = '';
  if (d.ownTeam.logo === undefined) d.ownTeam.logo = null;
  d.players.forEach(p => { if (p.photo === undefined) p.photo = null; });
  d.teams.forEach(t => { if (t.logo === undefined) t.logo = null; });
  d.games.forEach(g => {
    if (g.competitionId === undefined) g.competitionId = null;
    if (g.teamId === undefined) g.teamId = null;
    g.opponentGoals = g.opponentGoals || 0;
    if (!g.clock) g.clock = { halfLengthMinutes: 30, half: 1, running: false, startedAt: null, accumulatedSeconds: 0 };
  });
  return d;
}

function saveDataLocal(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

// Shared row → in-memory mapping for a `games` row, used both by the initial
// Supabase load and by the realtime change handler so both paths agree on shape.
function mapGameRow(g) {
  return {
    id: g.id, opponent: g.opponent, date: g.date,
    finished: g.finished, competitionId: g.competition_id,
    teamId: g.team_id,
    opponentGoals: g.opponent_goals || 0,
    events: g.events || [],
    clock: {
      halfLengthMinutes: g.clock_half_length_minutes || 30,
      half: g.clock_half || 1,
      running: g.clock_running || false,
      startedAt: g.clock_started_at,
      accumulatedSeconds: g.clock_accumulated_seconds || 0
    }
  };
}

async function loadDataFromSupabase() {
  const [playersRes, gamesRes, competitionsRes, teamsRes, stateRes] = await Promise.all([
    sb.from('players').select('*'),
    sb.from('games').select('*'),
    sb.from('competitions').select('*'),
    sb.from('teams').select('*'),
    sb.from('app_state').select('*').eq('id', 1).single()
  ]);

  if (playersRes.error || gamesRes.error || competitionsRes.error || teamsRes.error) {
    console.warn('Supabase load failed, falling back to localStorage');
    return null;
  }

  const players = (playersRes.data || []).map(p => ({
    id: p.id, name: p.name, number: p.number, photo: p.photo
  }));

  const games = (gamesRes.data || []).map(mapGameRow);

  const competitions = (competitionsRes.data || []).map(c => ({
    id: c.id, name: c.name, emoji: c.emoji, categoryType: c.category_type
  }));

  const teams = (teamsRes.data || []).map(t => ({
    id: t.id, name: t.name, logo: t.logo
  }));

  let activeGameId = stateRes.data ? stateRes.data.active_game_id : null;
  // Self-heal a stale pointer left over from before targeted deletes existed
  // (or any other way the referenced game stopped existing remotely).
  if (activeGameId && !games.some(g => g.id === activeGameId)) {
    activeGameId = null;
  }
  const ownTeam = {
    name: (stateRes.data && stateRes.data.team_name) || '',
    logo: (stateRes.data && stateRes.data.team_logo) || null
  };

  return { players, games, competitions, teams, ownTeam, activeGameId };
}

function saveData(d) {
  // Safety net: viewers without an admin session can't persist changes anyway
  // (the database rejects the write), so don't bother trying.
  if (!isAdmin()) return;
  // Sync write to localStorage (immediate cache)
  saveDataLocal(d);
  // Async write to Supabase (fire-and-forget)
  syncToSupabase(d);
}

// Explicit, targeted remote delete — call this at the moment the user deletes
// something (see deleteGame/removePlayer/deleteCompetition/deleteTeam), rather
// than diffing whole tables on every save (see note in syncToSupabase).
function deleteRemoteRow(table, id) {
  if (!isAdmin()) return;
  sb.from(table).delete().eq('id', id).then(({ error }) => {
    if (error) console.warn(`Supabase delete failed (${table}/${id}):`, error);
  });
}

let syncInFlight = false;
let syncQueued = false;
let lastSyncData = null;

async function syncToSupabase(d) {
  lastSyncData = d;
  if (syncInFlight) {
    syncQueued = true;
    return;
  }
  syncInFlight = true;

  try {
    const players = d.players.map(p => ({
      id: p.id, name: p.name, number: p.number, photo: p.photo
    }));
    const games = d.games.map(g => ({
      id: g.id, opponent: g.opponent, date: g.date,
      finished: g.finished, competition_id: g.competitionId,
      team_id: g.teamId,
      opponent_goals: g.opponentGoals || 0,
      events: g.events || [],
      clock_running: !!(g.clock && g.clock.running),
      clock_started_at: g.clock ? g.clock.startedAt : null,
      clock_accumulated_seconds: g.clock ? Math.floor(g.clock.accumulatedSeconds || 0) : 0,
      clock_half: g.clock ? g.clock.half : 1,
      clock_half_length_minutes: g.clock ? g.clock.halfLengthMinutes : 30
    }));
    const competitions = d.competitions.map(c => ({
      id: c.id, name: c.name, emoji: c.emoji, category_type: c.categoryType
    }));
    const teams = d.teams.map(t => ({
      id: t.id, name: t.name, logo: t.logo
    }));

    const results = await Promise.all([
      sb.from('players').upsert(players, { onConflict: 'id' }),
      sb.from('games').upsert(games, { onConflict: 'id' }),
      sb.from('competitions').upsert(competitions, { onConflict: 'id' }),
      sb.from('teams').upsert(teams, { onConflict: 'id' }),
      sb.from('app_state').upsert({
        id: 1,
        active_game_id: d.activeGameId,
        team_name: d.ownTeam.name,
        team_logo: d.ownTeam.logo
      }, { onConflict: 'id' })
    ]);

    // supabase-js resolves (rather than rejects) on a write that Postgres
    // rejects — it just comes back as { error }. Without checking this, a
    // partial write (e.g. one table's upsert failing a constraint) fails
    // completely silently: other devices just never see the change, with no
    // error anywhere. Surface it loudly instead.
    const tableNames = ['players', 'games', 'competitions', 'teams', 'app_state'];
    const failures = results
      .map((r, i) => ({ table: tableNames[i], error: r && r.error }))
      .filter(f => f.error);
    if (failures.length > 0) {
      const msg = failures.map(f => `${f.table}: ${f.error.message}`).join('\n');
      console.error('Supabase sync had errors:', failures);
      alert(`Some changes failed to save and won't show up on other devices:\n\n${msg}`);
    }

    // NOTE: we deliberately do NOT diff-delete rows here (i.e. "delete anything
    // remote that isn't in d.*"). Deletions are handled explicitly at the call
    // site (see deleteRemoteRow) when the user deletes something. Diffing on
    // every save is unsafe with multiple devices/tabs open: a device with a
    // stale in-memory `data` (e.g. a phone that's been idle since before a
    // game started) would wipe out rows created elsewhere in the meantime.

  } catch (err) {
    console.warn('Supabase sync error:', err);
  } finally {
    syncInFlight = false;
    if (syncQueued) {
      syncQueued = false;
      syncToSupabase(lastSyncData);
    }
  }
}

// URL hash routing — #/game, #/games, #/games/<id>, #/stats, #/team, #/settings.
// A hash (not a real path) works with zero server config on GitHub Pages and
// lets a refresh or a shared link land back on the exact same screen.
const VIEW_SLUGS = { game: 'game', history: 'games', stats: 'stats', roster: 'team', settings: 'settings' };
const SLUG_TO_VIEW = Object.fromEntries(Object.entries(VIEW_SLUGS).map(([view, slug]) => [slug, view]));

function hashFor(view, subId) {
  const slug = VIEW_SLUGS[view] || view;
  return subId ? `#/${slug}/${subId}` : `#/${slug}`;
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [slugPart, subId] = raw.split('/');
  const view = SLUG_TO_VIEW[slugPart] || 'game';
  return { view, subId: subId || null };
}

// ── Game clock ──
// Count-up stopwatch, not a countdown. `accumulatedSeconds` is the value the
// clock is counting up FROM for the current running segment; `startedAt` (if
// running) is when that segment began. This means elapsed time can always be
// recomputed from those two numbers alone — no per-second writes to Supabase,
// and every device (including one that was just asleep/backgrounded) gets the
// right answer the moment it re-renders.
function computeElapsedSeconds(clock) {
  if (!clock) return 0;
  let secs = clock.accumulatedSeconds || 0;
  if (clock.running && clock.startedAt) {
    secs += (Date.now() - new Date(clock.startedAt).getTime()) / 1000;
  }
  return Math.max(0, Math.floor(secs));
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// The minute a goal happened, in the scoring log's yellow circle: "23" for a
// goal at 23:45, or "30+2" for a goal at 32:45 in a 30-minute half (past that
// half's own boundary — halfLengthMinutes * half — it switches to stoppage
// notation instead of just continuing to count up). Falls back to a dash for
// goals recorded before this was tracked.
function formatGoalMinute(ev, game) {
  if (ev.clockSeconds === undefined || ev.clockSeconds === null) return '–';
  const minute = Math.floor(ev.clockSeconds / 60);
  const half = ev.half || 1;
  const halfLengthMinutes = (game.clock && game.clock.halfLengthMinutes) || 30;
  const boundary = halfLengthMinutes * half;
  return minute <= boundary ? String(minute) : `${boundary}+${minute - boundary}`;
}

function startClock() {
  const game = getActiveGame();
  if (!game || !game.clock || game.clock.running) return;
  game.clock.running = true;
  game.clock.startedAt = new Date().toISOString();
  saveData(data);
  render();
}

// Freezes the clock wherever it is (e.g. 32:35 if the half ran long) —
// admin taps this at the referee's whistle, not at the configured half length.
function endHalf() {
  const game = getActiveGame();
  if (!game || !game.clock || !game.clock.running || game.clock.half !== 1) return;
  game.clock.accumulatedSeconds = computeElapsedSeconds(game.clock);
  game.clock.running = false;
  game.clock.startedAt = null;
  saveData(data);
  render();
}

// Jumps the display to the configured half length (e.g. 30:00), discarding
// however much stoppage time the 1st half actually ran, and resumes ticking.
function startSecondHalf() {
  const game = getActiveGame();
  if (!game || !game.clock || game.clock.running || game.clock.half !== 1) return;
  game.clock.half = 2;
  game.clock.accumulatedSeconds = (game.clock.halfLengthMinutes || 0) * 60;
  game.clock.running = true;
  game.clock.startedAt = new Date().toISOString();
  saveData(data);
  render();
}

function getPlayerStats(playerId, competitionId) {
  const finishedGames = data.games.filter(g => {
    if (!g.finished) return false;
    if (competitionId !== undefined && competitionId !== null) return g.competitionId === competitionId;
    return true;
  });
  let goals = 0, assists = 0, games = 0;
  finishedGames.forEach(g => {
    let appeared = false;
    g.events.forEach(ev => {
      if (ev.scorerId === playerId) { goals++; appeared = true; }
      if (ev.assistId === playerId) { assists++; appeared = true; }
    });
    if (appeared) games++;
  });
  return { goals, assists, games };
}

function getCompetitionById(id) {
  return data.competitions.find(c => c.id === id);
}

// Competitions ordered by most recent game first, for the Schedule/Stats
// filter pills — whatever you're currently playing stays left-most instead of
// pills sitting in whatever order the rows came back from Supabase in.
// Competitions with no games yet sort to the end, keeping their relative order.
function competitionsByRecency() {
  const latestGame = {};
  data.games.forEach(g => {
    if (!g.competitionId) return;
    const t = new Date(g.date).getTime();
    if (isNaN(t)) return;
    if (latestGame[g.competitionId] === undefined || t > latestGame[g.competitionId]) {
      latestGame[g.competitionId] = t;
    }
  });
  return data.competitions.slice().sort((a, b) => {
    const at = latestGame[a.id] ?? -Infinity;
    const bt = latestGame[b.id] ?? -Infinity;
    return bt - at;
  });
}

function getTeamById(id) {

function resizeImageToDataURL(file, size, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Crop to square center
      const minDim = Math.min(img.width, img.height);
      const sx = (img.width - minDim) / 2;
      const sy = (img.height - minDim) / 2;
      ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      ${photoEl}

// ── Game management ──
function startGame() {
  const teamId = sanitizePickerValue(document.getElementById('game-team')?.value);
  const competitionId = sanitizePickerValue(document.getElementById('game-competition')?.value);
  const halfLengthMinutes = Math.max(1, parseInt(document.getElementById('game-half-length')?.value) || 30);
  const game = {
    id: Date.now().toString(),
    teamId,
    opponent: null,
    date: new Date().toISOString(),
    events: [],
    finished: false,
    competitionId,
    opponentGoals: 0,
    clock: { halfLengthMinutes, half: 1, running: false, startedAt: null, accumulatedSeconds: 0 }
  };
  data.games.push(game);
  data.activeGameId = game.id;
  saveData(data);
  closeModal();
  selectionState = null;
  render();
}

function endGame() {
  const game = getActiveGame();
  if (!game) return;
  if (game.clock && game.clock.running) {
    game.clock.accumulatedSeconds = computeElapsedSeconds(game.clock);
    game.clock.running = false;
    game.clock.startedAt = null;
  }
  game.finished = true;
  data.activeGameId = null;
  saveData(data);
  selectionState = null;
  render();
}

function getActiveGame() {
  if (!data.activeGameId) return null;
  return data.games.find(g => g.id === data.activeGameId) || null;
}

function deleteGame(id) {
  if (data.activeGameId === id) data.activeGameId = null;
  data.games = data.games.filter(g => g.id !== id);
  saveData(data);
  deleteRemoteRow('games', id);
  selectionState = null;
  viewingGameId = null;
  render();
}

// ── Goal recording ──
function selectGoalScorer(playerId, gameId) {
  if (playerId === OWN_GOAL_ID) {
    recordGoal(OWN_GOAL_ID, null, gameId || null);
    return;
  }
  selectionState = { type: 'assist', goalScorerId: playerId, gameId: gameId || null };
  render();
}

function selectAssist(playerId) {
  if (!selectionState || selectionState.type !== 'assist') return;
  recordGoal(selectionState.goalScorerId, playerId, selectionState.gameId);
}

function skipAssist() {
  if (!selectionState || selectionState.type !== 'assist') return;
  recordGoal(selectionState.goalScorerId, null, selectionState.gameId);
}

function recordAssistType(typeId) {
  if (!selectionState || selectionState.type !== 'assist') return;
  recordGoal(selectionState.goalScorerId, typeId, selectionState.gameId);
}

function recordGoal(scorerId, assistId, gameId) {
  const game = gameId ? data.games.find(g => g.id === gameId) : getActiveGame();
  if (!game) return;
  game.events.push({
    id: Date.now().toString(),
    scorerId,
    assistId,
    time: new Date().toISOString(),
    // Snapshot of the game clock at the moment this goal was recorded, so the
    // scoring log can show "the minute it happened" instead of a soccer ball.
    clockSeconds: computeElapsedSeconds(game.clock),
    half: game.clock ? game.clock.half : 1
  });
  saveData(data);
  selectionState = null;
  render();
}

function startAddGoalToGame(gameId) {
  selectionState = { type: 'scorer', gameId };
  render();
}

function removeGoal(gameId, eventId) {
  const game = data.games.find(g => g.id === gameId);
  if (!game) return;
  game.events = game.events.filter(e => e.id !== eventId);
  saveData(data);
  render();
}

function cancelSelection() {
  selectionState = null;
  render();
}

// ── Inline "+ Add new…" pickers (Team & Competition, used from game modals) ──
// A select's "+ Add new…" option stashes the in-progress game modal's field
// values, opens the Add Team/Competition modal on top, then reopens the
// original modal (with the new item pre-selected) once it's saved or cancelled.
function sanitizePickerValue(v) {
  return (!v || v === '__add_team__' || v === '__add_comp__') ? null : v;
}

function captureGameModalValues(type, gameId) {
  if (type === 'newGame') {
    return { type, values: {
      teamId: sanitizePickerValue(document.getElementById('game-team')?.value),
      competitionId: sanitizePickerValue(document.getElementById('game-competition')?.value),
      halfLengthMinutes: document.getElementById('game-half-length')?.value || null
    }};
  }
  if (type === 'editGame') {
    return { type, gameId, values: {
      teamId: sanitizePickerValue(document.getElementById('edit-game-team')?.value),
      dateStr: document.getElementById('edit-game-date')?.value || null,
      competitionId: sanitizePickerValue(document.getElementById('edit-game-competition')?.value),
      oppGoals: document.getElementById('edit-game-opp-goals')?.value ?? null
    }};
  }
  if (type === 'histGame') {
    return { type, values: {
      teamId: sanitizePickerValue(document.getElementById('hist-game-team')?.value),
      dateStr: document.getElementById('hist-game-date')?.value || null,
      competitionId: sanitizePickerValue(document.getElementById('hist-game-competition')?.value),
      oppGoals: document.getElementById('hist-game-opp-goals')?.value ?? null
    }};
  }
  return null;
}

function reopenStashedModal(stash, overrides) {
  const values = { ...stash.values, ...(overrides || {}) };
  if (stash.type === 'newGame') openNewGameModal(values);
  else if (stash.type === 'editGame') openEditGameModal(stash.gameId, values);
  else if (stash.type === 'histGame') openAddHistoricalGameModal(values);
}

function returnFromInlineAddModal(overrides) {
  const stash = modalReturnStash;
  modalReturnStash = null;
  if (stash) reopenStashedModal(stash, overrides);
  else closeModal();
}

function cancelInlineAddModal() {
  teamLogoDraft = null;
  returnFromInlineAddModal();
}

function onGameTeamPickerChange(selectEl, type, gameId) {
  if (selectEl.value !== '__add_team__') return;
  modalReturnStash = captureGameModalValues(type, gameId);
  openAddTeamModal();
}

function onGameCompetitionPickerChange(selectEl, type, gameId) {
  if (selectEl.value !== '__add_comp__') return;
  modalReturnStash = captureGameModalValues(type, gameId);
  openAddCompetitionModal();
}

function teamPickerOptionsHTML(selectedId) {
  const opts = data.teams
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(t => `<option value="${t.id}"${t.id === selectedId ? ' selected' : ''}>${t.name}</option>`)
    .join('');
  const addNew = isAdmin() ? `<option value="__add_team__">+ Add new team…</option>` : '';
  return `<option value="">None</option>${opts}${addNew}`;
}

function competitionPickerOptionsHTML(selectedId) {
  const opts = data.competitions
    .map(c => `<option value="${c.id}"${c.id === selectedId ? ' selected' : ''}>${c.name}</option>`)
    .join('');
  const addNew = isAdmin() ? `<option value="__add_comp__">+ Add new competition…</option>` : '';
  return `<option value="">None</option>${opts}${addNew}`;
}

// ── Render ──
function render() {
  updateAuthTab();
  renderGame();
  renderRoster();
  renderHistory();
  renderStats();
  renderSettings();
}

function updateAuthTab() {
  const admin = isAdmin();
  const label = document.getElementById('tab-settings-label');
  const lockIcon = document.getElementById('tab-settings-icon-lock');
  const gearIcon = document.getElementById('tab-settings-icon-gear');
  if (label) label.textContent = admin ? 'Settings' : 'Login';
  if (lockIcon) lockIcon.style.display = admin ? 'none' : '';
  if (gearIcon) gearIcon.style.display = admin ? '' : 'none';
}

function renderGame() {
  const el = document.getElementById('view-game');
  const game = getActiveGame();
  const admin = isAdmin();

  if (!game) {
    clearClockInterval();
    el.innerHTML = `
      <div class="view-header"><h1>Game</h1></div>
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <h3>No active game</h3>
        <p>${admin ? (data.players.length === 0 ? 'Add players to your roster first, then start a game.' : 'Start a new game to begin tracking stats.') : 'Check back once a game is underway.'}</p>
        ${admin ? (data.players.length > 0 ? `<button class="btn" onclick="openNewGameModal()">Start Game</button>` : `<button class="btn" onclick="goToView('roster')">Set Up Team</button>`) : ''}
      </div>`;
    return;
  }

  const cat = game.competitionId ? getCompetitionById(game.competitionId) : null;

  const goalLog = game.events.slice().reverse().map((ev, i) => `
    <div class="goal-entry">
      <div class="goal-icon"${formatGoalMinute(ev, game).length > 2 ? ' style="font-size:0.55rem"' : ''}>${formatGoalMinute(ev, game)}</div>
      <div class="goal-info">
        <div class="goal-scorer">${playerNameOnly(ev.scorerId)}</div>
        ${ev.assistId === PENALTY_KICK_ID || ev.assistId === FREE_KICK_ID ? `<div class="goal-assist">${playerNameOnly(ev.assistId)}</div>` : ev.assistId ? `<div class="goal-assist">Assist: ${playerNameOnly(ev.assistId)}</div>` : '<div class="goal-assist">Unassisted</div>'}
      </div>
      ${admin ? `<button class="goal-delete" onclick="removeGoal('${game.id}','${ev.id}')">✕</button>` : ''}
    </div>
  `).join('');

  const clock = game.clock || { halfLengthMinutes: 30, half: 1, running: false, startedAt: null, accumulatedSeconds: 0 };
  let clockControls = '';
  if (admin) {
    if (!clock.running && clock.accumulatedSeconds === 0 && clock.half === 1) {
      clockControls = `<button class="btn btn-sm btn-outline" onclick="startClock()">Start Game</button>`;
    } else if (clock.running && clock.half === 1) {
      clockControls = `<button class="btn btn-sm btn-outline" onclick="endHalf()">End Half</button>`;
    } else if (!clock.running && clock.half === 1 && clock.accumulatedSeconds > 0) {
      clockControls = `<button class="btn btn-sm btn-outline" onclick="startSecondHalf()">Resume Game</button>`;
    }
  }

  const oppGoalsControls = admin ? `
        <button class="btn btn-sm btn-outline" onclick="incrementOpponentGoals(-1)" style="padding:0.3rem 0.6rem;font-size:1rem;line-height:1">−</button>
        <span style="font-weight:700;min-width:1.5rem;text-align:center">${game.opponentGoals}</span>
        <button class="btn btn-sm btn-outline" onclick="incrementOpponentGoals(1)" style="padding:0.3rem 0.6rem;font-size:1rem;line-height:1">+</button>
  ` : `<span style="font-weight:700;min-width:1.5rem;text-align:center">${game.opponentGoals}</span>`;

  let liveControls = '';
  if (admin) {
    const isSelecting = selectionState !== null;
    const isAssistStep = selectionState?.type === 'assist';

    let prompt = '';
    if (!isSelecting) {
      prompt = `<div class="prompt-text">Tap the player who scored</div>`;
    } else if (isAssistStep) {
      const scorer = playerShort(selectionState.goalScorerId);
      prompt = `<div class="prompt-text" style="background:var(--surface2);color:var(--text)">Goal by ${scorer} — tap the assister</div>`;
    }

    const playerBtns = sortedPlayers().map(p => {
      let cls = 'player-btn';
      if (!isSelecting) cls += ' selecting-goal';
      if (isAssistStep && p.id !== selectionState.goalScorerId) cls += ' selecting-assist';
      if (isAssistStep && p.id === selectionState.goalScorerId) cls += '" style="opacity:0.3;pointer-events:none';

      const onclick = !isSelecting
        ? `selectGoalScorer('${p.id}')`
        : (isAssistStep && p.id !== selectionState.goalScorerId ? `selectAssist('${p.id}')` : '');

      return `<button class="${cls}" onclick="${onclick}">
        <span class="p-number">${p.number || '–'}</span>
        <span class="p-name">${p.name}</span>
      </button>`;
    }).join('');

    const ownGoalBtn = !isSelecting
      ? `<button class="player-btn selecting-goal" onclick="selectGoalScorer('${OWN_GOAL_ID}')" style="border-color:var(--border);background:var(--surface2)">
          <span class="p-number">OG</span>
          <span class="p-name">Own Goal</span>
        </button>`
      : '';

    liveControls = `
      ${prompt}
      <div class="player-grid">${playerBtns}${ownGoalBtn}</div>
      ${isAssistStep ? `<div class="skip-assist"><button class="btn btn-sm btn-outline" onclick="skipAssist()">No assist</button> <button class="btn btn-sm btn-outline" onclick="recordAssistType('${PENALTY_KICK_ID}')">Penalty Kick</button> <button class="btn btn-sm btn-outline" onclick="recordAssistType('${FREE_KICK_ID}')">Free Kick</button> <button class="btn btn-sm btn-outline" onclick="cancelSelection()">Cancel</button></div>` : ''}
    `;
  }

  el.innerHTML = `
    <div class="view-header">
      <h1>Live Game</h1>
      <div style="display:flex;gap:0.5rem">
        ${clockControls}
        ${admin ? `<button class="btn btn-sm btn-danger" onclick="confirmEndGame()">End Game</button>` : ''}
      </div>
    </div>
    <div class="game-status">
      <div style="font-size:0.75rem;color:var(--muted);margin-bottom:0.6rem">${formatDate(game.date)}</div>
      <div class="game-opponent" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;gap:0.35rem">${ownTeamLogoHTML(18)}${data.ownTeam.name || 'Your Team'}</span>
        <span style="opacity:0.6">vs</span>
        <span style="display:inline-flex;align-items:center;gap:0.35rem">${opponentLogoHTML(game, 18)}${opponentName(game)}</span>
      </div>
      ${cat ? `<div style="margin-top:0.6rem"><span class="category-badge">${cat.name}</span></div>` : ''}
      <div class="game-score">${formatScore(game)}</div>
      <div class="game-clock"><span id="game-clock-time">${formatClock(computeElapsedSeconds(clock))}</span></div>
      <div style="margin-top:0.5rem;display:flex;align-items:center;justify-content:center;gap:0.75rem">
        <span style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Opponent Goals</span>
        ${oppGoalsControls}
      </div>
    </div>
    ${liveControls}
    ${game.events.length > 0 ? `<div class="card goal-log"><label>Scoring</label>${goalLog}</div>` : ''}
  `;

  clearClockInterval();
  if (clock.running) {
    clockIntervalId = setInterval(tickClockDisplay, 1000);
  }
}

function renderHistory() {
  const el = document.getElementById('view-history');
  const admin = isAdmin();

  if (viewingGameId) {
    renderGameDetail(el);
    return;
  }

  let finished = data.games.filter(g => g.finished).sort((a, b) => new Date(b.date) - new Date(a.date));

  // Filter pills
  let filterHTML = '';
  if (data.competitions.length > 0) {
    const pills = [`<button class="filter-pill${gamesCompetitionFilter === null ? ' active' : ''}" onclick="filterGamesByCompetition(null)">All</button>`];
    competitionsByRecency().forEach(c => {
      pills.push(`<button class="filter-pill${gamesCompetitionFilter === c.id ? ' active' : ''}" onclick="filterGamesByCompetition('${c.id}')">${c.name}</button>`);
    });
    filterHTML = `<div class="filter-row">${pills.join('')}</div>`;
  }

  // Apply filter
  if (gamesCompetitionFilter !== null) {
    finished = finished.filter(g => g.competitionId === gamesCompetitionFilter);
  }

  if (data.games.filter(g => g.finished).length === 0) {
    el.innerHTML = `
      <div class="view-header"><h1>Schedule</h1>${admin ? `<button class="btn btn-sm" onclick="openAddHistoricalGameModal()">+ Add Game</button>` : ''}</div>
      ${filterHTML}
      <div class="empty-state">
        <p>No completed games yet.</p>
      </div>`;
    return;
  }

  // W-L-T / GF / GA / GD summary
  let w=0, l=0, t=0, gf=0, ga=0;
  finished.forEach(g => {
    const ours = g.events.length, theirs = g.opponentGoals;
    gf += ours; ga += theirs;
    if (ours > theirs) w++; else if (ours < theirs) l++; else t++;
  });
  const gd = gf - ga;
  const summaryHTML = `<div class="card" style="display:flex;justify-content:space-around;text-align:center;padding:0.75rem">
    <div><div style="font-size:1.3rem;font-weight:800">${w}-${l}-${t}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">W-L-T</div></div>
    <div><div style="font-size:1.3rem;font-weight:800">${gf}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GF</div></div>
    <div><div style="font-size:1.3rem;font-weight:800">${ga}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GA</div></div>
    <div><div style="font-size:1.3rem;font-weight:800;color:${gd<0?'var(--red)':'var(--text)'}">${gd>0?'+':''}${gd}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GD</div></div>
  </div>`;

  const gameCards = finished.map(g => {
    const scorers = {};
    g.events.forEach(ev => {
      if (ev.scorerId === OWN_GOAL_ID || !getPlayer(ev.scorerId)) return;
      const name = playerShort(ev.scorerId);
      scorers[name] = (scorers[name] || 0) + 1;
    });
    const topScorers = Object.entries(scorers).sort((a, b) => b[1] - a[1]).map(([n, c]) => `${n} (${c})`).join(', ');
    const cat = g.competitionId ? getCompetitionById(g.competitionId) : null;

    return `<div class="card game-card" onclick="goToGame('${g.id}')">
      <div class="game-card-date">${formatDate(g.date)}</div>
      <div class="game-card-row">
        <span class="game-card-opponent" style="display:inline-flex;align-items:center;gap:0.4rem">${opponentLogoHTML(g, 20)}${opponentName(g)}</span>
        <span class="game-card-score" style="color:${g.events.length < g.opponentGoals ? 'var(--red)' : 'var(--text)'}">${formatScore(g)}</span>
      </div>
      ${cat || topScorers ? `<div class="game-card-row">
        <span>${cat ? `<span class="category-badge">${cat.name}</span>` : ''}</span>
        <span class="game-card-stats">${topScorers}</span>
      </div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="view-header"><h1>Schedule</h1>${admin ? `<button class="btn btn-sm" onclick="openAddHistoricalGameModal()">+ Add Game</button>` : ''}</div>
    ${filterHTML}
    ${summaryHTML}
    ${gameCards}
  `;
}

function renderGameDetail(el) {

function renderStats() {
  const el = document.getElementById('view-stats');
  let finishedGames = data.games.filter(g => g.finished);

  // Filter pills
  let filterHTML = '';
  if (data.competitions.length > 0) {
    const pills = [`<button class="filter-pill${statsCompetitionFilter === null ? ' active' : ''}" onclick="filterStatsByCompetition(null)">All</button>`];
    competitionsByRecency().forEach(c => {
      pills.push(`<button class="filter-pill${statsCompetitionFilter === c.id ? ' active' : ''}" onclick="filterStatsByCompetition('${c.id}')">${c.name}</button>`);
    });
    filterHTML = `<div class="filter-row">${pills.join('')}</div>`;
  }

  // Apply filter
  if (statsCompetitionFilter !== null) {
    finishedGames = finishedGames.filter(g => g.competitionId === statsCompetitionFilter);
  }

  if (data.games.filter(g => g.finished).length === 0) {
    el.innerHTML = `
      <div class="view-header"><h1>Stats</h1></div>
      ${filterHTML}
      <div class="empty-state"><p>Complete a game to see season stats.</p></div>`;
    return;
  }

  const stats = {};
  data.players.forEach(p => { stats[p.id] = { goals: 0, assists: 0, games: 0 }; });

  finishedGames.forEach(g => {
    const appeared = new Set();
    g.events.forEach(ev => {
      if (ev.scorerId === OWN_GOAL_ID) return;
      if (!stats[ev.scorerId]) stats[ev.scorerId] = { goals: 0, assists: 0, games: 0 };
      stats[ev.scorerId].goals++;
      appeared.add(ev.scorerId);
      if (ev.assistId && ev.assistId !== PENALTY_KICK_ID && ev.assistId !== FREE_KICK_ID) {
        if (!stats[ev.assistId]) stats[ev.assistId] = { goals: 0, assists: 0, games: 0 };
        stats[ev.assistId].assists++;
        appeared.add(ev.assistId);
      }
    });
    appeared.forEach(id => { if (stats[id]) stats[id].games++; });
  });

  const rows = Object.entries(stats)
    .filter(([id]) => getPlayer(id))
    .sort((a, b) => {
      let av, bv;
      if (sortCol === 'total') { av = a[1].goals + a[1].assists; bv = b[1].goals + b[1].assists; }
      else { av = a[1][sortCol]; bv = b[1][sortCol]; }
      return (bv - av) * (sortDir === -1 ? 1 : -1);
    })
    .map(([id, s]) => { const p = getPlayer(id); return `<tr style="cursor:pointer" onclick="openPlayerProfile('${id}')"><td style="font-weight:800">${p ? p.number || '–' : '–'}</td><td>${p ? p.name : 'Unknown'}</td><td>${s.goals}</td><td>${s.assists}</td><td>${s.goals + s.assists}</td></tr>`; })
    .join('');

  function sortIcon(col) { return sortCol === col ? (sortDir === -1 ? ' ▼' : ' ▲') : ''; }
  function sortClass(col) { return sortCol === col ? 'sorted' : ''; }

  el.innerHTML = `
    <div class="view-header"><h1>Stats</h1></div>
    ${filterHTML}
${(() => { let w=0,l=0,t=0,gf=0,ga=0; finishedGames.forEach(g => { const ours=g.events.length, theirs=g.opponentGoals; gf+=ours; ga+=theirs; if(ours>theirs)w++; else if(ours<theirs)l++; else t++; }); const gd=gf-ga; return `<div class="card" style="display:flex;justify-content:space-around;text-align:center;padding:0.75rem">
      <div><div style="font-size:1.3rem;font-weight:800">${w}-${l}-${t}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">W-L-T</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${gf}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GF</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${ga}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GA</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${gd<0?'var(--red)':'var(--text)'}">${gd>0?'+':''}${gd}</div><div style="font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">GD</div></div>
    </div>`; })()}
    ${rows ? `<div class="card"><table class="stats-table"><thead><tr>
      <th>#</th>
      <th>Player</th>
      <th class="${sortClass('goals')}" onclick="setSort('goals')">G${sortIcon('goals')}</th>
      <th class="${sortClass('assists')}" onclick="setSort('assists')">A${sortIcon('assists')}</th>
      <th class="${sortClass('total')}" onclick="setSort('total')">Tot${sortIcon('total')}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty-state"><p>No goals recorded yet.</p></div>'}
  `;
}

function setSort(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = -1;
  }
  render();
}

    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" class="input" id="edit-game-date" value="${dateVal}">
    </div>
    <div class="form-group">
      <label>Competition</label>
      <select class="input" id="edit-game-competition" onchange="onGameCompetitionPickerChange(this,'editGame','${gameId}')">${competitionPickerOptionsHTML(competitionId)}</select>
    </div>
    <div class="form-group">
      <label>Opponent Goals</label>
      <input type="number" class="input" id="edit-game-opp-goals" value="${oppGoals}" min="0" style="max-width:100px">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveGameEdits('${gameId}')">Save</button>
    </div>
  `);
}

function saveGameEdits(gameId) {
  const game = data.games.find(g => g.id === gameId);
  if (!game) return;
  const teamId = sanitizePickerValue(document.getElementById('edit-game-team')?.value);
  const dateStr = document.getElementById('edit-game-date').value;
  const competitionId = sanitizePickerValue(document.getElementById('edit-game-competition')?.value);
  const oppGoals = parseInt(document.getElementById('edit-game-opp-goals').value) || 0;
  game.teamId = teamId;
  if (dateStr) game.date = new Date(dateStr + 'T12:00:00').toISOString();
  game.competitionId = competitionId;
  game.opponentGoals = Math.max(0, oppGoals);
  saveData(data);
  closeModal();
  render();
}

function openAddHistoricalGameModal(prefill) {
  prefill = prefill || {};
  const today = new Date().toISOString().split('T')[0];
  const dateVal = prefill.dateStr || today;
  const oppGoals = prefill.oppGoals !== undefined && prefill.oppGoals !== null ? prefill.oppGoals : 0;
  openModal(`
    <h2>Add Past Game</h2>
    <div class="form-group">
      <label>Opponent</label>
      <select class="input" id="hist-game-team" onchange="onGameTeamPickerChange(this,'histGame')">${teamPickerOptionsHTML(prefill.teamId ?? null)}</select>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" class="input" id="hist-game-date" value="${dateVal}">
    </div>
    <div class="form-group">
      <label>Competition</label>
      <select class="input" id="hist-game-competition" onchange="onGameCompetitionPickerChange(this,'histGame')">${competitionPickerOptionsHTML(prefill.competitionId ?? null)}</select>
    </div>
    <div class="form-group">
      <label>Opponent Goals</label>
      <input type="number" class="input" id="hist-game-opp-goals" value="${oppGoals}" min="0" style="max-width:100px">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="createHistoricalGame()">Create</button>
    </div>
  `);
}

function createHistoricalGame() {
  const teamId = sanitizePickerValue(document.getElementById('hist-game-team')?.value);
  const dateStr = document.getElementById('hist-game-date').value;
  const competitionId = sanitizePickerValue(document.getElementById('hist-game-competition')?.value);
  const oppGoals = parseInt(document.getElementById('hist-game-opp-goals').value) || 0;
  const game = {
    id: Date.now().toString(),
    teamId,
    opponent: null,
    date: dateStr ? new Date(dateStr + 'T12:00:00').toISOString() : new Date().toISOString(),
    events: [],
    finished: true,
    competitionId,
    opponentGoals: Math.max(0, oppGoals)
  };
  data.games.push(game);
  saveData(data);
  closeModal();
  viewingGameId = game.id;
  render();
}

function confirmEndGame() {
  const game = getActiveGame();
  if (!game) return;
  openModal(`
    <h2>End Game?</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:0.5rem">This will save the game to your history. You can still edit it later.</p>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete this in-progress game? All recorded goals will be lost. This cannot be undone.')){deleteGame('${game.id}');closeModal();}">Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Keep Playing</button>
      <button class="btn" onclick="endGame();closeModal()">End Game</button>
    </div>
  `);
}

// ── Realtime sync ──
// Pushes goal/score/clock changes made by the admin to every other open
// tab/device (including the admin's own other devices) without anyone having
// to manually refresh. These handlers only ever mutate local `data` and
// re-render — never saveData()/syncToSupabase() — so an incoming echo of our
// own write can never trigger another write and loop back to Supabase.
function applyRemoteGamesChange(payload) {
  // A write we just made ourselves is still in flight (or queued right behind
  // it): our local `data` is already at least as fresh as whatever Postgres
  // is echoing back right now, so applying it here could clobber a newer
  // local change with a stale one. Skip; the next real change picks it up.
  if (syncInFlight || syncQueued) return;
  if (payload.eventType === 'DELETE') {
    const id = payload.old.id;
    data.games = data.games.filter(g => g.id !== id);
    if (data.activeGameId === id) data.activeGameId = null;
  } else {
    const game = mapGameRow(payload.new);
    const idx = data.games.findIndex(g => g.id === game.id);
    if (idx >= 0) data.games[idx] = game; else data.games.push(game);
  }
  saveDataLocal(data);
  render();
}

function applyRemoteAppStateChange(payload) {
  if (syncInFlight || syncQueued || !payload.new) return;
  data.activeGameId = payload.new.active_game_id;
  data.ownTeam = { name: payload.new.team_name || '', logo: payload.new.team_logo || null };
  saveDataLocal(data);
  render();
}

// Re-syncs on (re)connect so a device that was backgrounded/asleep and missed
// pushed events (e.g. a phone that screen-locked mid-game) catches up right
// away instead of staying stale until something else happens to re-render it.
async function resyncFromSupabase() {
  if (syncInFlight || syncQueued) return;
  const remote = await loadDataFromSupabase();
  if (remote) {
    data = remote;
    saveDataLocal(data);
    render();
  }
}

function setupRealtimeSync() {
  sb.channel('games-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'games' }, applyRemoteGamesChange)
    .subscribe(status => { if (status === 'SUBSCRIBED') resyncFromSupabase(); });

  sb.channel('app-state-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'id=eq.1' }, applyRemoteAppStateChange)
    .subscribe();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') resyncFromSupabase();
  });
}

// ── Init ──
// Apply whatever's in the URL immediately using localStorage data, then refresh from Supabase
applyRoute();

(async () => {
  const remote = await loadDataFromSupabase();
  if (remote) {
    data = remote;
    saveDataLocal(data); // Update local cache
    // Re-apply the route: a shared link to a game/player that wasn't in the
    // stale local cache will resolve correctly once fresh data is in.
    applyRoute();
  }
})();

setupRealtimeSync();

// Back/forward, a pasted URL, or a shared link opened in an already-running tab
window.addEventListener('hashchange', applyRoute);
</script>
</body>
